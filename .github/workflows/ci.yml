name: ci

on: [ push, workflow_dispatch ]

jobs:
  unit-tests:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout
        uses: actions/checkout@v6
      -
        name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 21.1
      - run: node --version
      - run: npm install
      - run: ./test.sh
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      -
        name: Checkout
        uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      -
        name: Extended support release
        id: esr
        env:
          THUNDERBIRD_VERSION: esr
        run: ./script/docker_integration_test.sh
      # reusing same job to test different versions, and save some time in docker image
      # building
      #
      # latest/beta-latest run against Mozilla's bleeding-edge builds, which
      # can break due to upstream UI changes (e.g. new nag dialogs) unrelated
      # to this addon. They're not a merge gate (continue-on-error), only ESR
      # (our supported version range, see manifest.json) is.
      -
        name: latest version
        id: latest
        continue-on-error: true
        env:
          THUNDERBIRD_VERSION: latest
        run: ./script/docker_integration_test.sh
      -
        name: beta-latest version
        id: beta_latest
        continue-on-error: true
        env:
          THUNDERBIRD_VERSION: beta-latest
        run: ./script/docker_integration_test.sh
      -
        name: Upload screenshots on failure
        if: failure() || steps.latest.outcome == 'failure' || steps.beta_latest.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: test-screenshots-${{ github.run_id }}
          path: /tmp/test-screenshots/
          retention-days: 7
          if-no-files-found: ignore
